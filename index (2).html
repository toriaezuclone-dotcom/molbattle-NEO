function build(key,color){

  if(g=='Ph'){f.sh=3;m.push('ベンゼン環 共鳴シールド')}
  if(g=='X'){if(d<6){o.vx+=ux*10;o.vz+=uz*10}m.push('−Cl 衝撃波')}
  if(g=='alk'){f.bo=3;m.push('無極性 軽量ブースト')}}
 say((f===me?'あなた':'敵')+'のスキル：'+m.join('・'))}
const fml=A=>{const c={};A.forEach(x=>c[x[0]]=(c[x[0]]||0)+1);const r=e=>e=='C'?0:e=='H'?1:2;return Object.keys(c).sort((a,b)=>r(a)-r(b)||a.localeCompare(b)).map(e=>e+(c[e]>1?String(c[e]).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]):'')).join('')};
function detect(A,B){
 const adj=A.map(()=>[]);B.forEach(([a,b,o])=>{adj[a].push([b,o]);adj[b].push([a,o])});
 const el=i=>A[i][0],nH=i=>adj[i].filter(([j])=>el(j)=='H').length,T=new Set(),ord=(u,v)=>adj[u].find(([j])=>j==v)[1];
 A.forEach((x,i)=>{
  if(x[0]=='C'&&adj[i].some(([j,o])=>el(j)=='O'&&o==2))T.add(adj[i].some(([j,o])=>el(j)=='O'&&o==1&&nH(j)>0)?'COOH':'CO');
  if(x[0]=='O'&&nH(i)==1&&adj[i].length==2){const c=adj[i].find(([j])=>el(j)!='H')[0];if(!adj[c].some(([j,o])=>el(j)=='O'&&o==2))T.add('OH')}
  if(x[0]=='N'&&nH(i)==2)T.add('NH2');
  if(['F','Cl','Br','I'].includes(x[0]))T.add('X')});
 const cc=B.filter(([a,b])=>el(a)=='C'&&el(b)=='C'),aro=new Set(),key=(a,b)=>a<b?a+','+b:b+','+a;
 cc.forEach(([a,b])=>{const par={[a]:-1},q=[a];
  while(q.length){const u=q.shift();for(const [v] of adj[u]){if(el(v)!='C'||par[v]!==undefined||(u==a&&v==b))continue;par[v]=u;q.push(v)}}
  if(par[b]===undefined)return;const p=[b];while(p[p.length-1]!=a)p.push(par[p[p.length-1]]);
  if(p.length!=6)return;const E=p.map((u,k)=>[u,p[(k+1)%6]]);
  if(E.filter(([u,v])=>ord(u,v)==2).length==3){T.add('Ph');E.forEach(([u,v])=>aro.add(key(u,v)))}});
 if(cc.some(([a,b,o])=>ord(a,b)==2&&!aro.has(key(a,b))))T.add('CC2');
 return T.size?[...T].slice(0,4):['alk']}
function parseSDF(t,name){
 const L=t.split('\n'),na=+L[3].substr(0,3),nb=+L[3].substr(3,3);
 if(!na||na>200)throw new Error('原子数が多すぎます（上限200）');
 const A=[],B=[];
 for(let i=0;i<na;i++){const p=L[4+i].trim().split(/\s+/);A.push([p[3],+p[0],+p[1],+p[2]])}
 for(let i=0;i<nb;i++){const l=L[4+na+i];B.push([+l.substr(0,3)-1,+l.substr(3,3)-1,+l.substr(6,3)])}
 const k='pc_'+name.toLowerCase().replace(/\W/g,'_');
 MOL[k]={n:name+' '+fml(A),fg:detect(A,B),a:A.length>60?A.filter(x=>x[0]!=='H'):A,mass:Math.round(A.reduce((s,x)=>s+(M[x[0]]||30),0))};
 return k}
async function fetchMol(){
 const nm=$('en').value.trim(),st=$('fs');if(!nm)return;st.textContent='取得中…';
 try{const r=await fetch('https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/'+encodeURIComponent(nm)+'/SDF?record_type=3d');
  if(!r.ok)throw new Error(r.status==404?'3D構造が見つかりません（綴りを確認、または3D未登録の物質）':'取得エラー '+r.status);
  const k=parseSDF(await r.text(),nm);st.textContent='';look(k)}
 catch(e){st.textContent='⚠ '+(e instanceof TypeError?'PubChemに接続できません（ネット接続、またはこのページが外部接続を許可していない可能性）':e.message)}}
function _old(msg){
 const b=document.getElementById('box');
 b.innerHTML=`<h1>${msg||'分子ベイ'}</h1><p>分子を選んで激突！官能基があなたの能力になります。スピン切れか場外で負け。重い分子ほど強いが遅い。<br>操作: WASD/矢印 または画面ドラッグ</p><div class="g">`+
 Object.keys(MOL).sort((a,b)=>MOL[a].mass-MOL[b].mass).map(k=>`<button data-k="${k}">${MOL[k].n}<small>分子量 ${MOL[k].mass}｜${fgl(MOL[k].fg)}</small></button>`).join('')+'</div><h1 style="font-size:14px;margin-top:12px">官能基と能力（官能基が多いほど最大スピンは減少）</h1>'+Object.values(FG).map(v=>`<div class="fg"><b>${v[0]}</b>：${v[1]}</div>`).join('');

function acc(f,ax,az,dt){const k=16/Math.sqrt(f.mass)*(f.fg.has('CC2')?1.25:1)*(f.fg.has('alk')?1.15:1)*(f.bo>0?2:1);f.vx+=ax*k*dt;f.vz+=az*k*dt}
function hit(vn,nx,nz,im){
 const j=-1.9*vn/im*((me.fg.has('X')||en.fg.has('X'))?1.4:1);
 me.vx-=j*nx/me.mass;me.vz-=j*nz/me.mass;en.vx+=j*nx/en.mass;en.vz+=j*nz/en.mass;
 const q=Math.abs(vn);
 me.sp-=q*(.7+en.mass/40)*(en.fg.has('CO')?1.2:1)*(me.fg.has('Ph')?.75:1)*(me.sh>0?.3:1)*(en.ch>0?1.8:1);
 en.sp-=q*(.7+me.mass/40)*(me.fg.has('CO')?1.2:1)*(en.fg.has('Ph')?.75:1)*(en.sh>0?.3:1)*(me.ch>0?1.8:1);me.ch=en.ch=0;
 const m=[];
 for(const [a,b,w] of [[me,en,'あなた'],[en,me,'敵']]){
  if(a.fg.has('OH')){b.vx*=.7;b.vz*=.7;m.push(w+'の−OH：水素結合で粘着')}
  if(a.fg.has('COOH')){if(b.fg.has('NH2'))m.push('酸＋塩基＝中和！');else{b.acid=3;m.push(w+'の−COOH：酸性ダメージ')}}
  if(a.fg.has('CO'))m.push(w+'のC=O：分極で威力UP');
  if(b.fg.has('Ph'))m.push((b===me?'あなた':'敵')+'：ベンゼン環の共鳴で軽減');
  if(a.fg.has('X'))m.push(w+'のCl：電気陰性度で強く反発');
 }
 if(m.length)say(m.slice(0,2).join(' / '));
}
function step(dt){
 let ix=inp.x,iz=inp.z;
 if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iz-=1;if(keys.ArrowDown||keys.s)iz+=1;
 const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
 acc(me,ix,iz,dt);me.br=keys.Shift||btn.b;if(keys[' ']||btn.d){dash(me,ix,iz);btn.d=0;keys[' ']=0}if(keys.e||btn.s){skill(me,en);btn.s=0;keys.e=0}
 let dx=me.x-en.x,dz=me.z-en.z,dd=Math.hypot(dx,dz)||1;
 acc(en,dx/dd*.9+(Math.random()-.5)*.6,dz/dd*.9+(Math.random()-.5)*.6,dt);if(dd>5&&Math.random()<dt*.5)dash(en,dx,dz,.8);if(Math.random()<dt*.15)skill(en,me);
 for(const f of[me,en]){f.vx-=f.x*.9*dt;f.vz-=f.z*.9*dt;const dm=1-(f.br?5:.35)*dt;f.vx*=dm;f.vz*=dm;f.x+=f.vx*dt;f.z+=f.vz*dt;f.cd-=dt;f.dc-=dt;f.sh-=dt;f.ch-=dt;f.bo-=dt;f.sp-=(f.fg.has('alk')?.25:.5)*dt+(f.br?.6*dt:0);if(f.fg.has('NH2')){f.sp=Math.min(f.max,f.sp+.8*dt);f.acid=0}if(f.acid>0){f.sp-=3.5*dt;f.acid-=dt}}
 dx=en.x-me.x;dz=en.z-me.z;dd=Math.hypot(dx,dz)||.001;
 if(dd<2.6){
  const nx=dx/dd,nz=dz/dd,ov=2.6-dd,im=1/me.mass+1/en.mass;
  me.x-=nx*ov*(1/me.mass)/im;me.z-=nz*ov*(1/me.mass)/im;en.x+=nx*ov*(1/en.mass)/im;en.z+=nz*ov*(1/en.mass)/im;
  const vn=(en.vx-me.vx)*nx+(en.vz-me.vz)*nz;
  if(vn<0){hit(vn,nx,nz,im);
   }
 }
 for(const f of[me,en]){if(f.sp<=0||Math.hypot(f.x,f.z)>AR)f.dead=true}
 if(me.dead||en.dead){playing=false;setTimeout(()=>menu(me.dead&&en.dead?'相打ち！':en.dead?'勝利！🎉':'敗北…'),900)}
}
function draw(t,dt){$('bd').style.opacity=me.dc>0?.4:1;$('bs').style.opacity=me.cd>0?.4:1;$('bs').textContent='スキル'+(me.cd>0?' '+Math.ceil(me.cd):'');

  const fall=f.dead&&Math.hypot(f.x,f.z)>AR;

  const s=Math.max(f.sp,0)/f.max;f.spin.rotation.y+=(4+s*28)*dt;
  f.tilt.rotation.z=Math.sin(t*3+f.t)*(1-s)*.5-f.vx*.02;f.tilt.rotation.x=f.vz*.02+Math.cos(t*3.3+f.t)*(1-s)*.4;
 }
 document.querySelector('#p i').style.width=Math.max(me.sp,0)/me.max*100+'%';document.querySelector('#e i').style.width=Math.max(en.sp,0)/en.max*100+'%';
}

}
