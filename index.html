 b.querySelectorAll('button').forEach(x=>x.onclick=()=>start(x.dataset.k));
 document.getElementById('ov').style.display='flex';
}
function acc(f,ax,az,dt){const k=16/Math.sqrt(f.mass)*(1+.2*K(f,'CC2'))*(f.fg.has('alk')?1.15:1)*(f.bo>0?2:1);f.vx+=ax*k*dt;f.vz+=az*k*dt}
const SKT=new Set(['Ph','CY','CAGE','TET','ADA','DIA','PRIS','TWI','CATE','ROT','FEN']),sks=f=>[...f.fg].filter(g=>SKT.has(g));
const K=(f,t)=>f.fg.has(t)?(1-Math.pow(.75,f.cnt[t]||1))/.25:0;
const kb=f=>Math.max(.35,1-.3*K(f,'ADA')-.5*K(f,'DIA')-.4*K(f,'TWI')-.05*K(f,'X'));
const dmf=(a,b)=>(1+.25*K(a,'TET'))*(1+.15*K(a,'PRIS'))*(1+.1*K(a,'KET'))*(1+.15*K(b,'TET'))*Math.max(.4,1-.15*K(b,'ADA'))*Math.max(.4,1-.25*K(b,'DIA'))*Math.max(.4,1-.1*K(b,'CATE'))*Math.max(.4,1-.15*K(b,'ROT'))*Math.max(.4,1-.04*K(b,'X'));
const dod=b=>Math.random()<Math.min(.7,.25*K(b,'FEN'))?0:1;
function hit(vn,nx,nz,im){
 const hn=f=>f.fg.has('X')?(f.cnt.X||1):0;const j=-vn/im*(1+.27*(1+2.2*Math.sqrt(Math.min(24,hn(me)+hn(en))/24)));
 const apply=(f,dx,dz)=>{f.vx+=dx;f.vz+=dz};
 apply(me,-j*nx/me.mass*kb(me),-j*nz/me.mass*kb(me));apply(en,j*nx/en.mass*kb(en),j*nz/en.mass*kb(en));
 const q=Math.abs(vn);
 me.sp-=dod(me)*Math.max(.45*q,q*(.9+.5*en.lf)*(1+.2*K(en,'CO'))*Math.max(.4,1-.12*K(me,'Ph'))*(me.sh>0?.3:1)*(en.ch>0?1.8:1)*(1-.2*me.lf)*(1+.15*K(en,'NO2'))*(1+.1*K(me,'NO2'))*(1+.2*en.st*K(en,'CY'))*(1+.1*K(en,'CAGE'))*Math.max(.4,1-.2*K(me,'CAGE'))*dmf(en,me));
 en.sp-=dod(en)*Math.max(.45*q,q*(.9+.5*me.lf)*(1+.2*K(me,'CO'))*Math.max(.4,1-.12*K(en,'Ph'))*(en.sh>0?.3:1)*(me.ch>0?1.8:1)*(1-.2*en.lf)*(1+.15*K(me,'NO2'))*(1+.1*K(en,'NO2'))*(1+.2*me.st*K(me,'CY'))*(1+.1*K(me,'CAGE'))*Math.max(.4,1-.2*K(en,'CAGE'))*dmf(me,en));me.ch=en.ch=0;
 const m=[];
 for(const [a,b,w] of [[me,en,'あなた'],[en,me,'敵']]){
  if(a.fg.has('OH')){b.vx*=Math.pow(.7,K(a,'OH'));b.vz*=Math.pow(.7,K(a,'OH'));m.push(w+'の−OH：水素結合で粘着')}
  if(a.fg.has('COOH')){if(b.fg.has('NH2'))m.push('酸＋塩基＝中和！');else{b.acid=3;b.as=K(a,'COOH');m.push(w+'の−COOH：酸性ダメージ')}}
  if(a.fg.has('SO3H')){if(b.fg.has('NH2'))m.push('強酸＋塩基＝中和！');else{b.acid=5;b.as=1.6*K(a,'SO3H');m.push(w+'の−SO₃H：強酸で継続ダメージ')}}if(a.fg.has('CY'))m.push(w+'のシクロ環：環ひずみで威力UP');if(a.fg.has('CAGE'))m.push(w+'のかご型：ひずみ蓄積で威力UP・被ダメージ軽減');
  if(a.fg.has('NO2'))m.push(w+'の−NO₂：酸化力で威力UP（反動あり）');
  if(a.fg.has('KET')){b.sh=b.ch=b.bo=0;b.vx*=Math.pow(.8,K(a,'KET'));b.vz*=Math.pow(.8,K(a,'KET'));m.push(w+'のケトン：溶解で相手の強化を解除')}if(a.fg.has('NO2'))b.sp-=2*K(a,'NO2');
  if(a.fg.has('CO'))m.push(w+'のC=O：分極で威力UP');
  if(b.fg.has('Ph'))m.push((b===me?'あなた':'敵')+'：ベンゼン環の共鳴で軽減');
  if(a.fg.has('X'))m.push(w+'のCl：電気陰性度で強く反発');
 }
 if(m.length)say(m.slice(0,2).join(' / '));
}
function step(dt){
 let ix=inp.x,iz=inp.z;
 if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iz-=1;if(keys.ArrowDown||keys.s)iz+=1;
 const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
 acc(me,ix,iz,dt);me.br=keys.Shift||btn.b;if(keys[' ']||btn.d){dash(me,ix,iz);btn.d=0;keys[' ']=0}sks(me).forEach((g,i)=>{if(keys[String(i+1)]||(i==0&&keys.e)||btn.s===i){skill(me,en,g);keys[String(i+1)]=0;if(i==0)keys.e=0;btn.s=-1}});
 let dx=me.x-en.x,dz=me.z-en.z,dd=Math.hypot(dx,dz)||1;
 acc(en,(dx/dd*.9+(Math.random()-.5)*.6)*lv,(dz/dd*.9+(Math.random()-.5)*.6)*lv,dt);if(dd>5&&Math.random()<dt*.5*lv)dash(en,dx,dz,.8);{const s=sks(en);if(s.length&&Math.random()<dt*.15*lv*Math.min(2,s.length))skill(en,me,s[Math.floor(Math.random()*s.length)])}
 for(const f of[me,en]){f.vx-=f.x*.8*dt;f.vz-=f.z*.8*dt;{const r=Math.hypot(f.x,f.z);if(r>AR*.7){const k=(r-AR*.7)*4*dt/r;f.vx-=f.x*k;f.vz-=f.z*k}}const dm=1-(f.br?5:.6)*dt;f.vx*=dm;f.vz*=dm;f.x+=f.vx*dt;f.z+=f.vz*dt;f.gcd-=dt;if(f.cdt)for(const k in f.cdt)f.cdt[k]-=dt;f.cd-=dt;f.dc-=dt;f.sh-=dt;f.ch-=dt;f.bo-=dt;f.sp-=((f.fg.has('alk')?.25:.5)*(1-.6*f.lf))*dt+(f.br?.6*dt:0);if(f.fg.has('NH2')){f.sp=Math.min(f.max,f.sp+1.2*K(f,'NH2')*dt);f.acid=0}if(f.acid>0){f.sp-=3.5*dt*(f.as||1);f.acid-=dt;if(f.acid<=0)f.as=1}}
 dx=en.x-me.x;dz=en.z-me.z;dd=Math.hypot(dx,dz)||.001;
 for(const [a,b] of [[me,en],[en,me]]){const ux=(a.x-b.x)/dd,uz=(a.z-b.z)/dd;
  if(a.fg.has('OH')&&dd<5){const k=2.5*K(a,'OH')*dt;b.vx+=ux*k;b.vz+=uz*k}
  if(a.fg.has('COOH')&&dd<4&&!b.fg.has('NH2')&&!(b.acid>.3)){b.acid=.5;b.as=.3*K(a,'COOH')}
  if(a.fg.has('SO3H')&&dd<5&&!b.fg.has('NH2')&&!(b.acid>.3)){b.acid=.5;b.as=.6*K(a,'SO3H')}
  if(a.fg.has('CO')){a.chT=(a.chT||6)-dt;if(a.chT<=0){a.ch=3;a.chT=7/K(a,'CO')}}}
 if(lkT>0){lkT-=dt;const s=Math.max(0,dd-4)*2*dt,ux=dx/dd,uz=dz/dd;me.vx+=ux*s;me.vz+=uz*s;en.vx-=ux*s;en.vz-=uz*s}
 if(dd<2.6){
  const nx=dx/dd,nz=dz/dd,ov=2.6-dd,im=1/me.mass+1/en.mass;
  me.x-=nx*ov*(1/me.mass)/im;me.z-=nz*ov*(1/me.mass)/im;en.x+=nx*ov*(1/en.mass)/im;en.z+=nz*ov*(1/en.mass)/im;
  const vn=(en.vx-me.vx)*nx+(en.vz-me.vz)*nz;
  if(vn<0){hit(vn,nx,nz,im);
   }
 }
 for(const f of[me,en]){if(f.sp<=0||Math.hypot(f.x,f.z)>AR)f.dead=true}
 if(me.dead||en.dead){playing=false;setTimeout(()=>menu(me.dead&&en.dead?'相打ち！':en.dead?'勝利！🎉':'敗北…'),900)}
}
function draw(t,dt){$('bd').style.opacity=me.dc>0?.4:1;$('sl').querySelectorAll('button').forEach((b,i)=>{const g=sks(me)[i],c=(me.cdt&&me.cdt[g])||0;b.style.opacity=c>0||me.gcd>0?.4:1;b.textContent=(i+1)+':'+FG[g][0].split(' ')[0]+(c>0?' '+Math.ceil(c):'')});
 for(const f of[me,en]){
  const fall=f.dead&&Math.hypot(f.x,f.z)>AR;
  f.g.position.set(f.x,fall?(f.g.position.y-dt*8):0,f.z);
  const s=Math.max(f.sp,0)/f.max;f.spin.rotation.y+=(4+s*28)*(1+f.lf*.6)*dt;
  f.tilt.rotation.z=Math.sin(t*3+f.t)*(1-s)*.5-f.vx*.02;f.tilt.rotation.x=f.vz*.02+Math.cos(t*3.3+f.t)*(1-s)*.4;
 }
 document.querySelector('#p i').style.width=Math.max(me.sp,0)/me.max*100+'%';document.querySelector('#e i').style.width=Math.max(en.sp,0)/en.max*100+'%';
}
function loop(ts){
 const t=ts/1000,dt=Math.min(t-last,.05);last=t;
 if(pv)pv.spin.rotation.y+=dt*.4;if(me){if(playing)step(dt);draw(t,dt)}
 R.render(sc,cam);requestAnimationFrame(loop);
}
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?70:50;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
$('bd').onpointerdown=()=>btn.d=1;$('bb').onpointerdown=()=>btn.b=1;$('bb').onpointerup=$('bb').onpointerleave=()=>btn.b=0;
let ds=null;cv.addEventListener('pointerdown',e=>ds=[e.clientX,e.clientY]);
cv.addEventListener('pointermove',e=>{if(!ds)return;if(pv){pv.spin.rotation.y+=(e.clientX-ds[0])*.01;pv.tilt.rotation.x+=(e.clientY-ds[1])*.01;ds=[e.clientX,e.clientY];return}inp.x=Math.max(-1,Math.min(1,(e.clientX-ds[0])/60));inp.z=Math.max(-1,Math.min(1,(e.clientY-ds[1])/60))});
const up=()=>{ds=null;inp.x=inp.z=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
menu();requestAnimationFrame(loop);
</script></body></html>
